spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://YOUR-NEON-HOST/YOUR_DATABASE?sslmode=require}
    username: ${DB_USERNAME:YOUR_NEON_USERNAME}
    password: ${DB_PASSWORD:YOUR_NEON_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    root: INFO
    com.roomrental: DEBUG
