spring:
  application:
    name: smart-room-rental-saas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  tenant:
    header-name: ${TENANT_HEADER_NAME:X-Tenant-Id}
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      tenant-code: ${ADMIN_TENANT_CODE:admin}
      tenant-name: ${ADMIN_TENANT_NAME:Room Rental Admin}
      full-name: ${ADMIN_FULL_NAME:System Administrator}
      phone: ${ADMIN_PHONE:0900000000}
      email: ${ADMIN_EMAIL:admin@roomrental.com}
      password: ${ADMIN_PASSWORD:Admin@1234}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:test}
    api-key: ${CLOUDINARY_API_KEY:test}
    api-secret: ${CLOUDINARY_API_SECRET:test}
  ocr:
    provider: ${OCR_PROVIDER:GEMINI}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
