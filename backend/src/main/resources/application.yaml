spring:
  application:
    name: smart-room-rental-saas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  security:
    jwt-secret: ${JWT_SECRET:default-dev-secret-change-in-production}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  tenant:
    header-name: ${TENANT_HEADER_NAME:X-Tenant-Id}
  bootstrap:
    admin:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      tenant-name: ${ADMIN_TENANT_NAME:System Administration}
      full-name: ${ADMIN_FULL_NAME:System Administrator}
      phone: ${ADMIN_PHONE:0900000000}
      email: ${ADMIN_EMAIL:admin@roomrental.com}
      password: ${ADMIN_PASSWORD:Admin@1234}
