spring:
  datasource:
    url: jdbc:h2:mem:rental_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

# Disable admin bootstrap in tests
app:
  security:
    jwt-secret: test-jwt-secret-for-unit-tests-only
    access-token-minutes: 60
  tenant:
    header-name: X-Tenant-Id
  bootstrap:
    admin:
      enabled: false
      tenant-name: Test Tenant
      full-name: Test Admin
      phone: "0900000001"
      email: test@test.com
      password: test1234

# Disable Redis auto-config in tests
spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
